<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zoo Web APIs Lab</title>
</head>
<body>
  <h1>Zoo Web APIs Implementation</h1>

  <section>
    <h2>Geolocation</h2>
    <p id="locationStatus">Requesting location...</p>
  </section>

  <section>
    <h2>Local Storage Test</h2>
    <button onclick="saveToLocal(sampleAnimal)">Save Sample Animal</button>
    <button onclick="console.log(loadFromLocal(1))">Load Animal ID 1</button>
  </section>

  <section>
    <h2>Session Storage / Rate Limiting</h2>
    <button onclick="checkRateLimit()">Submit Action</button>
  </section>

  <script>
    // Expose functions to the global scope for button access
    const sampleAnimal = { id: 1, species: "Bear", name: "Baloo", age: 10 };

    function saveToLocal(animal) {
      try {
        const json = JSON.stringify(animal);
        localStorage.setItem(`animal-${animal.id}`, json);
        console.log("Animal saved to Local Storage.");
      } catch (err) {
        console.error("LocalStorage Save Error:", err.message);
      }
    }

    function loadFromLocal(id) {
      try {
        const json = localStorage.getItem(`animal-${id}`);
        return JSON.parse(json);
      } catch (err) {
        console.error("LocalStorage Load Error:", err.message);
        return null;
      }
    }

    function checkRateLimit() {
      const key = "zooSubmission";
      const last = sessionStorage.getItem(key);
      const now = Date.now();

      if (last && now - parseInt(last) < 30000) {
        console.warn("Rate limited! Please wait before submitting again.");
      } else {
        sessionStorage.setItem(key, now.toString());
        console.log("Submitted successfully.");
      }
    }

    function getUserLocation() {
      const locationStatus = document.getElementById("locationStatus");

      if (!navigator.geolocation) {
        locationStatus.textContent = "Geolocation not supported.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          locationStatus.textContent = `Latitude: ${latitude}, Longitude: ${longitude}`;
        },
        (err) => {
          locationStatus.textContent = `Error: ${err.message}`;
          console.error("Geolocation error:", err.message);
        }
      );
    }

    // Run location check on load
    getUserLocation();
  </script>
</body>
</html>
